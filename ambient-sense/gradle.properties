# Ambient Sense build configuration
# Conservative heap: this project builds fine in a small CI box, and a modest
# -Xmx keeps Gradle from being OOM-killed on memory-constrained machines.
org.gradle.jvmargs=-Xmx1100m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.workers.max=1

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Compile Kotlin inside the Gradle process (no separate compiler daemon).
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx700m
